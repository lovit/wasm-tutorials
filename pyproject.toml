# 이 저장소는 파이썬 패키지를 만들지 않는다. 예제 안의 .py 파일을 ruff 로 검사하려고 둔 설정이다.
# 그 파이썬 코드는 서버가 아니라 브라우저의 Pyodide 안에서 돈다.

[tool.ruff]
# 예제 코드는 튜토리얼에 그대로 인용되므로 좁은 화면에서도 읽혀야 한다.
line-length = 88
target-version = "py314"
extend-exclude = ["_site", ".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501", # line-length — ruff format 이 처리한다
]

# Pyodide 가 넣어 주는 모듈들. F821 을 통째로 끄면 예제의 오타까지 통과하므로
# 이름을 하나씩 알려 주고 검사는 켜 둔다.
builtins = ["js", "pyodide", "micropip"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
