name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # 액션은 커밋 SHA 로 고정한다. 태그는 옮길 수 있다.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: mise 설치
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          experimental: true

      - name: prek 훅 실행
        run: |
          mise use -g prek@latest
          prek run --all-files --show-diff-on-failure

      - name: 저장소 검사
        run: mise run check

      # 사이트 빌드가 깨진 채로 머지되면 배포가 실패한다. PR 단계에서 잡는다.
      # 토큰 없이도 마크다운을 원문으로 보여 주는 쪽으로 물러서며 끝까지 돈다.
      - name: 사이트 빌드 확인
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run site
